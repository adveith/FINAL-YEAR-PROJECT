name: welearn_flutter
description: WeLearn – Complete Learning Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.6.0
  pretty_dio_logger: ^1.3.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Firebase
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Agora Video
  agora_rtc_engine: ^6.3.2

  # Payment
  razorpay_flutter: ^1.3.6

  # UI
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  video_player: ^2.9.1
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  timeago: ^3.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  skeletonizer: ^1.4.2

  # Utils
  equatable: ^2.0.5
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
